spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/netflix_heak_clone}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true