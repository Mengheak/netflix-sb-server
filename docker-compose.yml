services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: my-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - postgres

  postgres:
    container_name: postgres-netflix
    image: postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: heak
      POSTGRES_PASSWORD: heak123
      PGDATA: /data/postgres
      POSTGRES_DB: ${DB_NAME:-netflix_heak_clone}
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - postgres
    restart: unless-stopped
  pgadmin:
    container_name: pdadmin-netflix-clone
    image: dpage/pgadmin4
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - postgres
    restart: unless-stopped
    depends_on:
      - postgres
volumes:
  postgres: {}

networks:
  postgres:
    driver: bridge