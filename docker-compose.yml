services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: my-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - postgres

  postgres:
    container_name: postgres-netflix
    image: postgres
    environment:
      POSTGRES_USER: heak
      POSTGRES_PASSWORD: heak123
      PGDATA: /data/postgres
      POSTGRES_DB: ${DB_NAME:-netflix_clone_heak}
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - postgres
    restart: unless-stopped

volumes:
  postgres: {}

networks:
  postgres:
    driver: bridge